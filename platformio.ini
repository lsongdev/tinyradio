[platformio]
default_envs = ats-mini

[env]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
lib_deps =
    lovyan03/LovyanGFX@1.2.7

; Board-specific code lives in src/boards/<name>/; each environment builds only its own.
[env:ats-mini]
board = esp32-s3-devkitc-1
; Sunnygold schematic: ESP32-S3-WROOM-1-N16R8. No PSRAM needed by this firmware.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
build_src_filter = +<*> -<boards/*/> +<boards/ats_mini/>
build_flags =
    -D BOARD_ATS_MINI
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

